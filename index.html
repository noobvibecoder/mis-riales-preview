<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/mis-riales-preview/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mis riales, app Flutter para presupuesto mensual, gastos reales y reportes.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mis riales">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mis riales</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #F7F8F4;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app-loader {
      align-items: center;
      background:
        radial-gradient(circle at 50% 24%, rgba(33, 128, 102, 0.10), transparent 32%),
        #F7F8F4;
      color: #143E34;
      display: flex;
      flex-direction: column;
      gap: 18px;
      inset: 0;
      justify-content: center;
      position: fixed;
      text-align: center;
      z-index: 9999;
    }

    .loader-logo {
      align-items: center;
      display: flex;
      gap: 14px;
    }

    .loader-logo img {
      border-radius: 18px;
      box-shadow: 0 18px 36px rgba(20, 62, 52, 0.18);
      height: 64px;
      width: 64px;
    }

    .loader-logo strong {
      font-size: 28px;
      letter-spacing: 0;
      line-height: 1;
    }

    .loader-logo span {
      color: #18A05F;
    }

    .loader-message {
      color: #5E6E68;
      font-size: 15px;
      max-width: 280px;
    }

    .loader-bar {
      background: #DDE8E2;
      border-radius: 999px;
      height: 5px;
      overflow: hidden;
      width: min(280px, 72vw);
    }

    .loader-bar::before {
      animation: loader-slide 1.1s ease-in-out infinite;
      background: linear-gradient(90deg, #117D5A, #20B66E);
      border-radius: inherit;
      content: "";
      display: block;
      height: 100%;
      width: 44%;
    }

    @keyframes loader-slide {
      0% {
        transform: translateX(-110%);
      }
      100% {
        transform: translateX(250%);
      }
    }
  </style>
</head>
<body>
  <div id="app-loader" aria-live="polite">
    <div class="loader-logo">
      <img src="icons/Icon-192.png" alt="">
      <strong>Mis <span>riales</span></strong>
    </div>
    <div class="loader-bar" aria-hidden="true"></div>
    <div class="loader-message">Cargando tu presupuesto...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('app-loader');
      if (loader) {
        loader.remove();
      }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
