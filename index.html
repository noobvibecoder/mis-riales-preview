<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/mis-riales-preview/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="RIALES, app Flutter para registrar gastos reales y deudas.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RIALES">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="preload" as="image" href="logo-loader.png" fetchpriority="high">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RIALES</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #FBF8FF;
    }

    body {
      position: fixed;
      inset: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #app-loader {
      align-items: center;
      background:
        radial-gradient(circle at 50% 24%, rgba(95, 20, 230, 0.12), transparent 32%),
        #FBF8FF;
      color: #211931;
      display: flex;
      flex-direction: column;
      gap: 18px;
      inset: 0;
      justify-content: center;
      position: fixed;
      text-align: center;
      z-index: 9999;
    }

    .loader-logo {
      align-items: center;
      aspect-ratio: 580 / 165;
      display: flex;
      width: clamp(200px, 56vw, 240px);
    }

    .loader-logo img {
      display: block;
      filter: drop-shadow(0 14px 24px rgba(53, 25, 85, 0.16));
      height: auto;
      width: 100%;
    }

    .loader-message {
      color: #6E647B;
      font-size: 15px;
      max-width: 280px;
    }

    .loader-bar {
      background: #E4D7FA;
      border-radius: 999px;
      height: 5px;
      overflow: hidden;
      width: min(280px, 72vw);
    }

    .loader-bar::before {
      animation: loader-slide 1.1s ease-in-out infinite;
      background: linear-gradient(90deg, #5F14E6, #7B3DFF);
      border-radius: inherit;
      content: "";
      display: block;
      height: 100%;
      width: 44%;
    }

    @keyframes loader-slide {
      0% {
        transform: translateX(-110%);
      }
      100% {
        transform: translateX(250%);
      }
    }
  </style>
</head>
<body>
  <div id="app-loader" aria-live="polite">
    <div class="loader-logo">
      <img src="logo-loader.png" width="580" height="165" alt="RIALES" decoding="sync" fetchpriority="high">
    </div>
    <div class="loader-bar" aria-hidden="true"></div>
    <div class="loader-message">Cargando RIALES...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('app-loader');
      if (loader) {
        loader.remove();
      }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
